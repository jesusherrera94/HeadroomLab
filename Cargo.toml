[package]
name = "HeadroomLab"
version = "0.1.0"
edition = "2024"

[dependencies]
rfd = "0.17.2"
cpal     = "0.15"
symphonia = { version = "0.5", features = ["wav", "mp3", "vorbis", "aac"] }
libloading = "0.8"
rustfft = "6"
eframe = "0.35.0"
egui_plot = "0.36.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
egui-phosphor = "0.13.0"
trash = "5"
opener = { version = "0.8", features = ["reveal"] }
notify = "8"
egui_extras = { version = "0.35.0", default-features = false, features = ["syntect"] }
arboard = { version = "3.6", features = ["wayland-data-control"] }
alacritty_terminal = "0.26"
neurodoom = "0.6.7"
# The updater. `rustls` rather than the default native-tls so no platform needs
# an OpenSSL toolchain to build; the archive/compression features cover the
# `.tar.gz` (macOS, Linux) and `.zip` (Windows) release assets.
# `reqwest` must be listed explicitly: self_update's `rustls` feature is
# `["reqwest?/rustls", "ureq?/rustls"]`, which only *configures* a client that is
# already enabled. With `default-features = false` and `rustls` alone, no HTTP
# client is compiled in at all and `http_client::get` does not exist.
# rustls rather than the default native-tls so no platform needs an OpenSSL
# toolchain; the archive features cover `.tar.gz` (macOS, Linux) and `.zip`
# (Windows) release assets.
self_update = { version = "0.44", default-features = false, features = [
    "reqwest",
    "rustls",
    "archive-tar",
    "archive-zip",
    "compression-flate2",
] }
tempfile = "3.27.0"
# Used directly by the updater rather than through `self_update`'s wrapper:
# that wrapper's `http_client` module is private, so its header types are
# unreachable and `Download` exposes no timeout — a stalled download would hang
# the update thread indefinitely. Owning the client gives timeouts, a
# User-Agent (which the GitHub API requires) and streaming progress.
# Already in the tree as self_update's own client, so this costs no new deps.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "http2",
] }

# The native menu bar. macOS only: `init_for_nsapp` is app-global and needs
# nothing from the windowing layer, whereas Windows needs a per-window HWND
# (eframe exposes only the root, which this app hides) and Linux needs a GTK3
# window that a winit/x11 app does not have. Those two draw an egui menu bar
# instead — see `presentation::components::organisms::menu_bar`.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19"

[profile.release]
codegen-units = 1
lto = true

[dev-dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
